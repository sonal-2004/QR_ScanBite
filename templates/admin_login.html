<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ScanBite Admin Login</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f3ee;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:36px;border-radius:18px;box-shadow:0 12px 40px #0001;width:min(380px,90%)}h1{margin:0 0 8px}p{color:#777}label{display:block;margin:18px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:10px;background:#222;color:#fff;font-size:16px;cursor:pointer}.error{color:#b00020;background:#fff0f0;padding:10px;border-radius:8px}.hint{font-size:13px;color:#888;margin-top:16px}</style></head><body><div class="box"><h1>☕ ScanBite</h1><p>Admin Dashboard Login</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Username</label><input name="username" required><label>Password</label><input type="password" name="password" required><button type="submit">Login</button></form></div></body></html>
