<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Combo Offer</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/header.css') }}">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/combo.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">


<div class="card">

<h1>Combo Includes</h1>

<div class="items">

<div class="item">

<img src="{{ url_for('static', filename='images/chickenburger.jpeg') }}">

<h3>Classic Burger</h3>

</div>

<div class="plus">+</div>

<div class="item">

<img src="{{ url_for('static', filename='images/frenchfries.png') }}">

<h3>French Fries</h3>

</div>

<div class="plus">+</div>

<div class="item">

<img src="{{ url_for('static', filename='images/cold_brew.jpeg') }}">

<h3>Cold Drink</h3>

</div>

</div>

<hr>

<div class="priceSection">

<div>

<p>MRP</p>

<h3 class="mrp">₹597</h3>

</div>

<div>

<p>Special Price</p>

<h1>₹399</h1>

</div>

<div>

<p>You Save</p>

<h2 class="save">₹198</h2>

</div>

</div>

<hr>

<div class="quantity">

<h2>Quantity</h2>

<div class="qty">

<button onclick="decrease()">-</button>

<span id="qty">1</span>

<button onclick="increase()">+</button>

</div>

</div>

<button class="cartBtn" onclick="addCombo()">

Add To Cart

</button>

</div>

</div>

<script src="{{ url_for('static', filename='js/cart.js') }}"></script>
<script src="{{ url_for('static', filename='js/combo.js') }}"></script>

</body>

</html>
